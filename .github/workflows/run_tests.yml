name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev --all-extras --no-interaction

      - name: Lint
        run: poetry run ruff check src tests

      - name: Format check
        run: poetry run ruff format --check src tests

      - name: Run tests
        # The `integration` marker requires live provider keys — skip in CI.
        run: poetry run pytest -m "not integration" --cov=vox --cov-report=xml --cov-report=term
