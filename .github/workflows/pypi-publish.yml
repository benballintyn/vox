name: Publish to PyPI

# Triggered by a `v*.*.*` tag. release-please creates that tag (and the
# matching GitHub Release) when its release PR is merged — see
# release_please.yml. This workflow's job is narrower: given a release tag,
#   1. Verify the tag version matches `pyproject.toml`.
#   2. Run tests across all supported Pythons.
#   3. Build sdist + wheel with Poetry.
#   4. Publish to PyPI via OIDC trusted publishing (no token).
#
# The GitHub Release itself is created by release-please, not here.
#
# Cutting a release: merge the standing release-please PR. That bumps the
# version, updates CHANGELOG.md, pushes the tag, and creates the GitHub
# Release — which in turn triggers this workflow to publish to PyPI.
#
# If this workflow fails after PyPI accepts the upload, you cannot re-publish
# the same version — PyPI versions are immutable. A follow-up patch release
# (another release-please PR) is the way forward.

on:
  push:
    tags:
      - "v*.*.*"

# Concurrency: only one publish at a time. A second tag pushed while the
# first is mid-flight will queue.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag matches pyproject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"      # v0.1.0
          VERSION="${TAG#v}"                  # 0.1.0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / Version: $VERSION"

      - name: Verify pyproject.toml version matches tag
        run: |
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$PYPROJECT_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match tag version (${{ steps.tag.outputs.version }})"
            exit 1
          fi
          echo "Versions match: $PYPROJECT_VERSION"

  test:
    name: Test (py${{ matrix.python-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install poetry
      - run: poetry install --with dev --all-extras --no-interaction
      - run: poetry run pytest -m "not integration"

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - name: Build
        run: poetry build
      - name: Inspect dist
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment is required for OIDC trusted publishing. The
    # matching environment name must be set on the PyPI pending publisher
    # configuration (https://pypi.org/manage/account/publishing/).
    environment:
      name: pypi
      url: https://pypi.org/p/vox-llm
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
