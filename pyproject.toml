[project]
name = "vox"
version = "0.1.0"
description = "Model-agnostic LLM execution library"
authors = [
    {name = "Ben Ballintyn", email = "benballintyn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0,<3.0",
    "loguru>=0.7.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
all = ["openai>=1.50", "anthropic>=0.40", "google-genai>=1.0"]

[tool.poetry]
packages = [{include = "vox", from = "src"}]

[tool.poetry.group.dev.dependencies]
ipython = "^8.23.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
coverage = "^7.6.10"
pytest-asyncio = "^0.25.2"
pytest-mock = "^3.14.0"
ruff = ">=0.4"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live API keys"]
