[project]
# Distribution name on PyPI. The Python import name is still `vox`
# (`from vox import ...`) — only `pip install` uses the distribution name.
# Renamed from "vox" because that name was already taken on PyPI.
name = "vox-llm"
version = "0.6.0"
description = "Model-agnostic LLM execution library"
authors = [
    {name = "Ben Ballintyn", email = "benballintyn@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["llm", "openai", "anthropic", "gemini", "tool-use", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "loguru>=0.7.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/benballintyn/vox"
Repository = "https://github.com/benballintyn/vox"
Issues = "https://github.com/benballintyn/vox/issues"
Changelog = "https://github.com/benballintyn/vox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
# Client-side video decoding for VideoContent fallback on providers
# without a native video-input surface (currently: every provider
# except Gemini). Pulls in ffmpeg via imageio-ffmpeg. Not needed if you
# only ever send video to Gemini, or never send video at all.
video = ["imageio[ffmpeg]>=2.34"]
all = [
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "imageio[ffmpeg]>=2.34",
]

[tool.poetry]
packages = [{include = "vox", from = "src"}]

[tool.poetry.group.dev.dependencies]
ipython = "^8.23.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
coverage = "^7.6.10"
pytest-asyncio = "^0.25.2"
pytest-mock = "^3.14.0"
# Reruns flaky integration tests on transient network/5xx errors so a
# blip doesn't fail the suite. Applied globally to integration tests
# only, via tests/integration/conftest.py.
pytest-rerunfailures = "^15.0"
ruff = ">=0.4"
mypy = "^2.1.0"
# Used by tests covering the VideoContent fallback (frame extraction)
# in src/vox/_video.py — same package end users install via the
# `vox-llm[video]` extra.
imageio = {extras = ["ffmpeg"], version = ">=2.34"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live API keys"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
# src/ layout: treat `src` as a package base so src/vox/... resolves to the
# `vox.*` modules — the same names the test suite imports. Without this,
# mypy sees each source file twice (as `src.vox.*` and `vox.*`).
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
